"$schema" = "https://starship.rs/config-schema.json"

palette = "rose-pine-moon"

format = """$directory[](fg:pastel_rose)
$character"""

right_format = "$status$cmd_duration"

[palettes.rose-pine-moon]
# Rose Pine Moon palette (rosepinetheme.com) — accessibility-tuned
# medium-dark variant (2.5 contrast ratio). See ../themes/rose-pine-moon.tmux
# for the same semantic roles expressed as tmux user options.
bg           = "#232136"
bg_darker    = "#2a273f"
bg_lighter   = "#393552"
selection    = "#44415a"
fg           = "#e0def4"
comment      = "#6e6a86"
red          = "#eb6f92"
orange       = "#eb6f92"   # no canonical orange; collapses to love
yellow       = "#f6c177"
green        = "#9ccfd8"   # no canonical green; collapses to foam
cyan         = "#9ccfd8"
purple       = "#c4a7e7"
pink         = "#ea9a97"
frame        = "#44415a"
# Personal accent — Rose Pine Moon's rose hex (#ea9a97). More
# terra-cotta than Main's #ebbcba; same prompt slot.
pastel_rose = "#ea9a97"
# Alias so the prompt format below stays portable across themes.
# base3 here is dark (#232136 = Moon base) — chip-text inversion
# for the rose pastel_rose. Within rose-pine-moon, tmux's @color_light_fg
# is light (#e0def4 = text) — chip-text inversion is per-tool, not theme-wide.
base3       = "#232136"

[directory]
format = "[ $path ]($style)"
style  = "fg:base3 bg:pastel_rose"
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[❯](bold fg:pastel_rose)"
error_symbol   = "[❯](bold fg:pastel_rose)"
vicmd_symbol   = "[❮](bold fg:pastel_rose)"

[cmd_duration]
min_time = 2000
format   = "[ $duration]($style) "
style    = "fg:pastel_rose"

[status]
disabled = false
format   = "[✘ $status]($style) "
style    = "fg:pastel_rose"

[jobs]
disabled = true
