# ─── Prefix ─────────────────────────────────
# C-a (screen-style) — C-Space conflicts with macOS input-source switching
# when multiple keyboard layouts are enabled.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Terminal ───────────────────────────────
# Prefer tmux-256color terminfo; fall back to screen-256color on stock macOS.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:hyperlinks"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:hyperlinks"

# ─── General ────────────────────────────────
set -g mouse on  # URLs need Shift+Cmd+click in tmux — see README "Quirks"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000

# When the last pane in a session exits (Ctrl-D, `exit`, kill-session),
# switch to the most-recently-used other session instead of detaching.
# Falls back to detach if no other session exists.
set -g detach-on-destroy off

# No bells anywhere — Ghostty/zsh/vim are also silenced; this kills tmux's
# own bell flag (#F) on the window status line.
set -g bell-action none
set -g visual-bell off
set -g monitor-bell off

# ─── Window naming ──────────────────────────
# allow-rename off: ignore OSC title escapes from apps (e.g. Claude Code,
# which sets the title to its version string).
# automatic-rename on: tmux drives the window name with four-tier precedence:
#   1. @claude_session_name (per-pane) → render `claude[<name>]`. Set by the
#      claude-tmux-window-name helper invoked from Claude Code's
#      SessionStart/Stop/SessionEnd hooks; cleared on SessionEnd. Currently
#      dormant — Claude Code's session JSON dropped the `.name` field as of
#      ~2.1.126, so the helper no-ops; tier kept for forward-compat in case
#      upstream restores it.
#   2. pane_current_command matches semver (^[0-9]+\.[0-9]+\.[0-9]+$) →
#      render `claude[<basename(cwd)>]`. Detects Claude Code's per-version
#      binary (~/.local/share/claude/versions/<X.Y.Z>) which the kernel
#      records as the foreground `comm`. Sidesteps the dead .name field
#      entirely.
#   3. @last_cmd (per-pane)            → render the last typed command. Set by
#      the zsh/fish preexec hooks (_tmux_record_last_cmd in
#      .config/zsh/tmux-hooks.zsh and .config/fish/conf.d/50-tmux-hooks.fish).
#   4. fallback                        → pane_current_command (typically the
#      shell name).
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format '#{?#{!=:#{@claude_session_name},},claude[#{@claude_session_name}],#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude[#{b:pane_current_path}],#{?#{==:#{@last_cmd},},#{pane_current_command},#{@last_cmd}}}}'

# ─── Outer-terminal title (Ghostty tab) ────────
# Drive the Ghostty tab title from the active pane. While an `ssh` command is
# foreground in the active pane, render " user@host" — Nerd Font globe (U+F0AC,
# nf-fa-globe) plus the canonical destination, matching tmux-ssh-indicator's
# glyph. Otherwise render "<session>:<window>".
#
# @ssh_target is set/cleared by the _tmux_record_ssh_target /
# _tmux_clear_ssh_target zsh hooks (.zshrc); refresh-client -S in those hooks
# pushes the update instantly rather than waiting for the 5s status-interval
# tick. The literal globe is embedded as raw UTF-8, same pattern as the glyphs
# already in status-left.
set -g set-titles on
set -g set-titles-string "#{?#{!=:#{@ssh_target},},  #{@ssh_target},#S:#W}"

# ─── Splits keep cwd, mirror Ghostty's bindings ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── New window: honor @session_root (set by `s`) ──
# `s` stamps @session_root with the worktree/project root on every invocation
# (incl. re-attach), so <prefix> c lands at the session root rather than
# inheriting pane cwd. Format mirrors tmux.conf:50 (the @claude_session_name
# emptiness test). Splits intentionally keep pane_current_path — house rule.
# Sessions not started by `s` have no @session_root → falls back to
# pane_current_path (tmux default behavior, no regression).
bind c new-window -c "#{?#{!=:#{@session_root},},#{@session_root},#{pane_current_path}}"

# ─── Vim-style pane nav (with prefix) ───────
# Alt is reserved for Polish diacritics (ą ć ę ł ń ó ś ź ż), so we use prefix.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Reload ─────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ─── PR pin: open in browser ────────────────
# `<prefix> P` opens the current branch's PR in the default browser via
# `gh pr view --web`. When no PR exists, gh exits non-zero and run-shell
# swallows the error silently. Visible counterpart in the status bar is
# the orange PR pin (drives tmux-status-right + tmux-pr-detect).
bind P run-shell "cd '#{pane_current_path}' && gh pr view --web 2>/dev/null"

# ─── sessionx popup ─────────────────────────
# Session picker is `omerxx/tmux-sessionx` (TPM plugin loaded below).
# The plugin claims <prefix> t via `@sessionx-bind 't'` set in the TPM
# block — no explicit bind-key needed here (and adding one would be
# clobbered or would clobber depending on order). Default preview shows
# the highlighted session's active pane via `tmux capture-pane -ep`.
# Width and height (`@sessionx-window-{width,height}`) are pinned to
# 70%.
# We keep the lowercase `t` / uppercase `T` swap so clock-mode lives
# on `T` (lowercase is the picker we use constantly).
bind-key "T" clock-mode

# ─── Dashboard pagination ────────────────────
# `bin/dashboard` is the multi-session live preview command. These keys are
# no-ops outside dashboard-* sessions (the script checks #S and bails).
# DASHBOARD_TARGET=#{session_name} disambiguates inside run-shell, where
# `display-message -p '#S'` returns the global most-recent active session
# rather than the run-shell target.
bind-key -N "Dashboard: page rows down" J \
  run-shell 'DASHBOARD_TARGET=#{session_name} dashboard --page-down 2>/dev/null || true'
bind-key -N "Dashboard: page rows up" K \
  run-shell 'DASHBOARD_TARGET=#{session_name} dashboard --page-up 2>/dev/null || true'

# ─── Plugins (TPM) ──────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# tmux-sessionx provides the <prefix> t session picker (replacing the
# sesh-picker wrapper). The plugin claims `t` via @sessionx-bind during
# TPM `run` below — we don't need a manual bind-key. Geometry pinned to
# 70% × 70%. Sources: tmux + tmuxinator only (zoxide stays off — house
# rule). Default preview uses `tmux capture-pane -ep` to show the
# highlighted session's active pane content; the script (preview.sh) is
# hardcoded — there's no preview-command hook to override.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 't'
set -g @sessionx-window-width '70%'
set -g @sessionx-window-height '70%'
set -g @sessionx-tmuxinator-mode 'on'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-filter-current 'true'
set -g @sessionx-preview-enabled 'true'

run '~/.config/tmux/plugins/tpm/tpm'

# ─── Status line (Solarized base16 + powerline) ──
# base03=#002b36 base02=#073642 base01=#586e75 base00=#657b83
# base0 =#839496 base1 =#93a1a1 base2 =#eee8d5 base3 =#fdf6e3
# yellow=#b58900 orange=#cb4b16 red   =#dc322f magenta=#d33682
# violet=#6c71c4 blue  =#268bd2 cyan  =#2aa198 green  =#859900

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#073642,fg=#839496"

# Center the window list on the full status-bar width (ignores the widths
# of status-left / status-right). Plain `centre` would center within the
# remaining gap and — given asymmetric content — sit visually off-center.
set -g status-justify absolute-centre

# Left: session name on a blue chip; gains a leading globe glyph when any attached tmux client is SSH-rooted (drives tmux-ssh-indicator).
set -g status-left "#[fg=#fdf6e3,bg=#268bd2,bold]  #(~/.config/tmux/bin/tmux-ssh-indicator)#S #[fg=#268bd2,bg=#073642] "
set -g status-left-length 80

# Windows
setw -g window-status-format         "#[fg=#586e75,bg=#073642] #I:#W "
setw -g window-status-current-format "#[fg=#859900,bg=#073642]#[fg=#fdf6e3,bg=#859900,bold] #I:#W #[fg=#859900,bg=#073642]"

# Right: orchestrator that composes the PR pin (when a PR exists for the
# current branch) and the branch chip. Git chip is always flush-right —
# mirrors the session chip's flush-left anchor on the left of the bar.
# Helpers: tmux-status-right → tmux-pr-detect (cache + gh) + tmux-git-status.
set -g status-right "#(~/.config/tmux/bin/tmux-status-right #{pane_current_path})"
set -g status-right-length 80

# ─── Selection, messages, and pane borders ──
# Override tmux defaults that fall outside the Solarized palette.
set -g mode-style            "bg=#2aa198,fg=#002b36"  # mouse / copy-mode selection
set -g message-style         "bg=#2aa198,fg=#002b36"  # display notifications (e.g. "config reloaded")
set -g message-command-style "bg=#002b36,fg=#2aa198"  # prefix-: command prompt (inverted — preserves tmux's "input field" look)
set -g pane-border-style        "fg=#586e75"          # inactive pane border (base01)
set -g pane-active-border-style "fg=#268bd2"          # active pane border (Solarized blue)
