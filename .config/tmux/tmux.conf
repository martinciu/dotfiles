# ─── Prefix ─────────────────────────────────
# C-a (screen-style) — C-Space conflicts with macOS input-source switching
# when multiple keyboard layouts are enabled.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Terminal ───────────────────────────────
# Prefer tmux-256color terminfo; fall back to screen-256color on stock macOS.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:hyperlinks"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:hyperlinks"

# ─── General ────────────────────────────────
set -g mouse on  # URLs need Shift+Cmd+click in tmux — see README "Quirks"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
# Read CSI-u / xterm modifyOtherKeys from Ghostty and pass through to inner
# apps. Without this, modifier+arrow combos (e.g. `<prefix> M-Up` for pane
# resize) arrive as `ESC [1;3A`-style sequences that tmux can't parse as
# `M-Up`, so the binding never fires. Alt+letter / Alt+digit work either
# way because they use the legacy `ESC <byte>` meta prefix.
set -g extended-keys on
set -g focus-events on
set -g history-limit 50000
# Longer repeat window (default 500ms) so `-r` bindings — Tab/S-Tab for
# session cycling, mainly — keep accepting taps without re-prefixing
# during a brief pause.
set -g repeat-time 1000

# When the last pane in a session exits (Ctrl-D, `exit`, kill-session),
# switch to the most-recently-used other session instead of detaching.
# Falls back to detach if no other session exists.
set -g detach-on-destroy off

# Each window sizes to its most-recently-active client, so an attached
# iPhone (grouped `phone` twin — see fish 50-moshi-tmux.fish) only shrinks
# the window it's actually using, and it snaps back when the Mac touches
# it. tmux >= 3.1 default, pinned because the phone workflow relies on it.
set -g window-size latest

# No bells anywhere — Ghostty/zsh/vim are also silenced; this kills tmux's
# own bell flag (#F) on the window status line.
set -g bell-action none
set -g visual-bell off
set -g monitor-bell off

# ─── Outer-terminal title (Ghostty tab) ────
# Drive the Ghostty tab title from tmux's <session>:<window> instead of
# letting OSC titles from inside panes leak through.
set -g set-titles on
set -g set-titles-string "#S:#W"

# ─── Splits keep cwd, mirror Ghostty's bindings ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── New window: honor @session_root (set by `s`) ──
# `s` stamps @session_root with the worktree/project root on every invocation
# (incl. re-attach), so <prefix> c lands at the session root rather than
# inheriting pane cwd. The format below is tmux's standard ternary
# emptiness test (`#{?#{!=:VAR,},THEN,ELSE}`). Splits intentionally keep
# pane_current_path — house rule. Sessions not started by `s` have no
# @session_root → falls back to pane_current_path (tmux default behavior,
# no regression).
bind c new-window -c "#{?#{!=:#{@session_root},},#{@session_root},#{pane_current_path}}"

# ─── Vim-style pane nav (with prefix) ───────
# Prefix path is the established muscle memory. `bind -n M-h/j/k/l` is
# safe with Ghostty's `macos-option-as-alt = left` (only left-Option
# fires M-*; right-Option still types Polish ą/ć/ę/ł/ń/ó/ś/ź/ż), but
# no root Alt-nav is wired here by choice.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Session cycling ────────────────────────
# Single canonical pair on the home row / thumb:
#   <prefix> Space  → last (most-recently-used) session
#   <prefix> Tab    → next session   (repeatable — hold prefix once,
#                                     tap Tab to keep cycling)
#   <prefix> S-Tab  → previous session (repeatable; BTab = back-tab)
# Defaults `L` / `(` / `)` are unbound so cycling lives on this pair only
# and those keys stay free for other uses. Also overrides default
# <prefix> Space (next-layout) — pane layouts unused here (prefix h/j/k/l
# + | / - cover splits).
unbind L
unbind (
unbind )
bind    Space switch-client -l
bind -r Tab   switch-client -n
bind -r BTab  switch-client -p

# ─── Window cycling ─────────────────────────
# Unshifted neighbours on the US layout for rapid window-hop.
#   <prefix> ,  → previous window (repeatable)
#   <prefix> .  → next window     (repeatable)
# Defaults `n`/`p` are unbound — the unshifted, repeatable `,`/`.` pair is
# the only cycling keystroke we want, and freeing `n`/`p` keeps them
# available for future bindings. Overrides the default `,` rename-window;
# manual rename remains reachable via `<prefix> :rename-window <name>`
# from the command prompt.
unbind ,
unbind .
unbind n
unbind p
bind -r , previous-window
bind -r . next-window

# ─── Window reordering ──────────────────────
# Shove the current window left/right by one index. Repeatable so a single
# prefix press lets you keep nudging until placed. `-d` keeps focus on the
# moved window (its index changes with the swap); without `-d`, focus would
# jump to the displaced neighbour instead.
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# ─── Reload ─────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ─── Copy mode: vi keys + PageUp drops into scrollback ───
set -g mode-keys vi
unbind -n PageUp
bind PageUp copy-mode -u
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ─── PR pin: open in browser ────────────────
# `<prefix> P` opens the current branch's PR in the default browser via
# `gh pr view --web`. When no PR exists, gh exits non-zero and run-shell
# swallows the error silently. Visible counterpart in the status bar is
# the orange PR pin (drives tmux-status-right + tmux-pr-detect).
bind P run-shell "cd '#{pane_current_path}' && gh pr view --web 2>/dev/null"

# ─── sessionx popup ─────────────────────────
# Session picker is `omerxx/tmux-sessionx` (TPM plugin loaded below).
# The plugin claims <prefix> t via `@sessionx-bind 't'` set in the TPM
# block — no explicit bind-key needed here (and adding one would be
# clobbered or would clobber depending on order). Default preview shows
# the highlighted session's active pane via `tmux capture-pane -ep`.
# Width and height (`@sessionx-window-{width,height}`) are pinned to
# 70%.
# We keep the lowercase `t` / uppercase `T` swap so clock-mode lives
# on `T` (lowercase is the picker we use constantly).
bind-key "T" clock-mode

# ─── Theme palette (sourced via ~/.config/themes/current.tmux symlink) ──
# Defines @color_* user options used throughout status-line definitions and
# read by helper scripts via `tmux show-option -gv`. Swap themes via the
# fish function `theme-set <solarized|mocha>`.
source-file -F '#{HOME}/.config/themes/current.tmux'

# ─── Status line ──
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#{@color_bar_bg},fg=#{@color_default_fg}"

# Center the window list on the full status-bar width (ignores the widths
# of status-left / status-right). Plain `centre` would center within the
# remaining gap and — given asymmetric content — sit visually off-center.
set -g status-justify absolute-centre

# Left: session chip + the Claude-usage cluster.
#   - Session: name on a blue chip; gains a leading globe glyph when any
#     attached tmux client outside a @phone_twin session is SSH- or
#     mosh-rooted (drives tmux-ssh-indicator; phone twins excluded, #366).
#   - Claude usage: violet 5h chip + yellow 7d chip pair, fused. Drives
#     tmux-claude-usage (parses ccpulse status --json on each tick).
#     Hides cleanly when ccpulse is missing or the JSON lacks fields.
set -g status-left "#(~/.config/tmux/bin/tmux-statusbar-guard)#[fg=#{@color_light_fg},bg=#{@color_accent_blue},bold]  #(~/.config/tmux/bin/tmux-ssh-indicator)#S #[fg=#{@color_accent_blue},bg=#{@color_bar_bg}] #(~/.config/tmux/bin/tmux-claude-usage)"
set -g status-left-length 120

# Windows
setw -g window-status-format         "#[fg=#{@color_muted_fg},bg=#{@color_bar_bg}] #I:#W "
setw -g window-status-current-format "#[fg=#{@color_accent_green},bg=#{@color_bar_bg}]#[fg=#{@color_light_fg},bg=#{@color_accent_green},bold] #I:#W #[fg=#{@color_accent_green},bg=#{@color_bar_bg}]"

# Right: orchestrator that composes the PR pin (when a PR exists for the
# current branch) and the branch chip. Git chip is always flush-right —
# mirrors the session chip's flush-left anchor on the left of the bar.
# Helpers: tmux-status-right → tmux-pr-detect (cache + gh) + tmux-git-status.
# MUST be set before the TPM `run` below: tmux-continuum prepends its
# auto-save hook #(…/continuum_save.sh) to status-right at plugin load, so
# assigning status-right after TPM wipes the hook and silently kills
# periodic auto-save (#357). Guarded by scripts/test-tmux-conf-shape.sh.
set -g status-right "#(~/.config/tmux/bin/tmux-status-right #{pane_current_path})"
set -g status-right-length 80

# ─── Phone clients (Moshi) → bar-less grouped twin (#366) ──
# Moshi's session picker attaches straight into the target session — no
# login shell, so conf.d/50-moshi-tmux.fish never runs — after `set -g`ing
# status-right '' (killing the PR pin + continuum's auto-save hook). This
# hook classifies every attaching client server-side: Moshi/mobile clients
# (remote ancestry + non-Ghostty TERM) are switched into a bar-less
# grouped twin of the session they attached to and the clobbered globals
# repaired (tmux-phone-attach → tmux-phone-twin). Local/Ghostty attaches
# are a cheap no-op. -b: never block the attach itself.
set-hook -g client-attached "run-shell -b '~/.config/tmux/bin/tmux-phone-attach #{hook_client}'"

# ─── Selection, messages, and pane borders ──
# Override tmux defaults that fall outside the palette.
set -g mode-style            "bg=#{@color_accent_cyan},fg=#{@color_deep_bg}"  # mouse / copy-mode selection
set -g message-style         "bg=#{@color_accent_cyan},fg=#{@color_deep_bg}"  # display notifications (e.g. "config reloaded")
set -g message-command-style "bg=#{@color_deep_bg},fg=#{@color_accent_cyan}"  # prefix-: command prompt (inverted — preserves tmux's "input field" look)
set -g pane-border-style        "fg=#{@color_muted_fg}"          # inactive pane border (base01)
set -g pane-active-border-style "fg=#{@color_accent_blue}"          # active pane border (Solarized blue)

# ─── Plugins (TPM) ──────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# 15 min is the plugin default — pinned to document intent (#357).
set -g @continuum-save-interval '15'

# tmux-sessionx provides the <prefix> t session picker (replacing the
# sesh-picker wrapper). The plugin claims `t` via @sessionx-bind during
# TPM `run` below — we don't need a manual bind-key. Geometry pinned to
# 70% × 70%. Sources: tmux + tmuxinator only (zoxide stays off — house
# rule). Default preview uses `tmux capture-pane -ep` to show the
# highlighted session's active pane content; the script (preview.sh) is
# hardcoded — there's no preview-command hook to override.
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 't'
set -g @sessionx-window-width '70%'
set -g @sessionx-window-height '70%'
set -g @sessionx-tmuxinator-mode 'on'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-filter-current 'true'
set -g @sessionx-preview-enabled 'true'

# tmux-fingers: vimium-style hints for one-keystroke copy of visible
# matches (paths, URLs, SHAs, k8s names, #N refs, worktree- branches).
# First-run: after `prefix + I`, the wizard appears — pick "Build from
# source" (crystal required — `brew install crystal` if absent;
# tmux-fingers is intentionally not in Brewfile, the formula also
# compiles from source).
#   <prefix> F  → copy-mode: hint → letter → clipboard
#   <prefix> J  → jump-mode: hint → letter → cursor at match in copy-mode
# Hint styles use ANSI palette refs so they auto-adapt across themes.
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-hint-style               "fg=colour9,bold"   # red, bold
set -g @fingers-highlight-style          "fg=colour13"       # magenta
set -g @fingers-backdrop-style           "fg=colour10"       # muted base01
set -g @fingers-selected-hint-style      "fg=colour14,bold"  # cyan, bold
set -g @fingers-selected-highlight-style "fg=colour14"       # cyan
set -g @fingers-pattern-0 'worktree-[a-z0-9._/-]+'
set -g @fingers-pattern-1 '#\d+'

run '~/.config/tmux/plugins/tpm/tpm'

# ─── Plugin overrides (must come AFTER `run` above) ──
# `tmux-sensible` adds `<prefix> C-p` / `<prefix> C-n` for window cycling.
# We already have `,` / `.` as the single canonical cycle pair (see
# "Window cycling" above); drop the C-p/C-n shadows so cycling lives on
# one keystroke pair only and `C-p`/`C-n` stay free for other uses.
unbind C-p
unbind C-n
