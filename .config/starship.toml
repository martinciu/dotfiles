"$schema" = "https://starship.rs/config-schema.json"

palette = "solarized_dark"

format = """
[╭─](frame)$directory$git_branch$git_status
[╰─](frame)$character"""

right_format = "$cmd_duration$jobs$status"

[palettes.solarized_dark]
# Same hex codes already pinned in tmux/btop/lnav configs.
base03  = "#002b36"
base02  = "#073642"
base01  = "#586e75"
base00  = "#657b83"
base0   = "#839496"
base1   = "#93a1a1"
base2   = "#eee8d5"
base3   = "#fdf6e3"
yellow  = "#b58900"
orange  = "#cb4b16"
red     = "#dc322f"
magenta = "#d33682"
violet  = "#6c71c4"
blue    = "#268bd2"
cyan    = "#2aa198"
green   = "#859900"
frame   = "#586e75"   # base01 — matches p10k color 242 used today

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style  = "blue"

[git_branch]
format = "on [$symbol$branch]($style) "
style  = "violet"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style  = "yellow"

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vicmd_symbol   = "[❮](green)"

[cmd_duration]
min_time = 2000
format   = "took [$duration]($style) "
style    = "yellow"

[jobs]
format = "[$symbol$number]($style) "
style  = "cyan"

[status]
disabled = false
format   = "[$status]($style) "
style    = "red"
