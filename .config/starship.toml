"$schema" = "https://starship.rs/config-schema.json"

palette = "solarized_dark"

format = """$directory[](fg:pastel_rose)
$character"""

right_format = "$status$cmd_duration"

[palettes.solarized_dark]
# Same hex codes already pinned in tmux/btop/lnav configs.
base03  = "#002b36"
base02  = "#073642"
base01  = "#586e75"
base00  = "#657b83"
base0   = "#839496"
base1   = "#93a1a1"
base2   = "#eee8d5"
base3   = "#fdf6e3"
yellow  = "#b58900"
orange  = "#cb4b16"
red     = "#dc322f"
magenta = "#d33682"
violet  = "#6c71c4"
blue    = "#268bd2"
cyan    = "#2aa198"
green   = "#859900"
frame   = "#586e75"   # base01 — matches p10k color 242 used today
# Pastel powerline accents — scoped exception to "Solarized everywhere" (see CLAUDE.md).
# Used only by the prompt; every other tool stays Solarized.
pastel_rose  = "#DA627D"

[directory]
format = "[](fg:pastel_rose)[ $path ]($style)"
style  = "fg:base3 bg:pastel_rose"
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[❯](bold fg:pastel_rose)"
error_symbol   = "[❯](bold fg:pastel_rose)"
vicmd_symbol   = "[❮](bold fg:pastel_rose)"

[cmd_duration]
min_time = 2000
format   = "[ $duration]($style) "
style    = "fg:pastel_rose"

[status]
disabled = false
format   = "[✘ $status]($style) "
style    = "fg:pastel_rose"

[jobs]
disabled = true
