"$schema" = "https://starship.rs/config-schema.json"

palette = "rose-pine"

format = """$directory[](fg:pastel_rose)
$character"""

right_format = "$status$cmd_duration"

[palettes.rose-pine]
# Rose Pine Main palette (rosepinetheme.com) — see ../themes/rose-pine.tmux
# for the same semantic roles expressed as tmux user options.
bg           = "#191724"
bg_darker    = "#1f1d2e"
bg_lighter   = "#26233a"
selection    = "#403d52"
fg           = "#e0def4"
comment      = "#6e6a86"
red          = "#eb6f92"
orange       = "#eb6f92"   # no canonical orange; collapses to love
yellow       = "#f6c177"
green        = "#9ccfd8"   # no canonical green; collapses to foam
cyan         = "#9ccfd8"
purple       = "#c4a7e7"
pink         = "#ebbcba"
frame        = "#403d52"
# Personal accent — Rose Pine's literal "rose" hex (#ebbcba). The
# theme's namesake colour finally gets a prominent UI slot; chip
# backgrounds use love (red/orange role) and iris (violet role), so
# rose is reserved for the prompt.
pastel_rose = "#ebbcba"
# Alias so the prompt format below stays portable across themes.
# base3 here is dark (#191724 = Rose Pine base) — chip-text inversion
# for the rose pastel_rose, against which light text reads as a
# low-contrast wash. Same Mocha/Dracula/Gruvbox/Tokyo-Night pattern;
# differs from Nord, where the prompt uses a darker pastel_rose and
# base3 = nord0. Within rose-pine, tmux's @color_light_fg is light
# (#e0def4 = text) — chip-text inversion is per-tool, not theme-wide.
base3       = "#191724"

[directory]
format = "[ $path ]($style)"
style  = "fg:base3 bg:pastel_rose"
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[❯](bold fg:pastel_rose)"
error_symbol   = "[❯](bold fg:pastel_rose)"
vicmd_symbol   = "[❮](bold fg:pastel_rose)"

[cmd_duration]
min_time = 2000
format   = "[ $duration]($style) "
style    = "fg:pastel_rose"

[status]
disabled = false
format   = "[✘ $status]($style) "
style    = "fg:pastel_rose"

[jobs]
disabled = true
