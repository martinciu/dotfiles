# .config/tealdeer/config-kanagawa.toml — Kanagawa Wave palette for
# tldr. Follows theme-set; flipped to config.toml by the theme-set
# function. Roles: command_name = bold header accent, description =
# muted text, example_code = the literal command, example_variable =
# highlighted + underlined. example_text intentionally unset → inherits
# terminal default (neutral prose).
#
# Colors MUST be { rgb = { r, g, b } } tables — tealdeer 1.8's [style]
# parser rejects "#hex" strings.

[style.command_name]
foreground = { rgb = { r = 210, g = 126, b = 153 } }
bold = true

[style.description]
foreground = { rgb = { r = 114, g = 113, b = 105 } }

[style.example_code]
foreground = { rgb = { r = 118, g = 148, b = 106 } }

[style.example_variable]
foreground = { rgb = { r = 192, g = 163, b = 110 } }
underline = true
