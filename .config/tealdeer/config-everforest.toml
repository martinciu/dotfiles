# .config/tealdeer/config-everforest.toml — Everforest Dark Medium palette
# for tldr. Follows theme-set; flipped to config.toml by the theme-set
# function. Roles: command_name = bold header accent, description = muted
# text, example_code = the literal command, example_variable = highlighted
# + underlined. example_text intentionally unset → inherits terminal
# default (neutral prose).
#
# Colors MUST be { rgb = { r, g, b } } tables — tealdeer 1.8's [style]
# parser rejects "#hex" strings.

[style.command_name]
foreground = { rgb = { r = 214, g = 153, b = 182 } }
bold = true

[style.description]
foreground = { rgb = { r = 133, g = 146, b = 137 } }

[style.example_code]
foreground = { rgb = { r = 167, g = 192, b = 128 } }

[style.example_variable]
foreground = { rgb = { r = 219, g = 188, b = 127 } }
underline = true
