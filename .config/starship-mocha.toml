"$schema" = "https://starship.rs/config-schema.json"

palette = "catppuccin_mocha"

format = """$directory[](fg:pastel_rose)
$character"""

right_format = "$status$cmd_duration"

[palettes.catppuccin_mocha]
# Catppuccin Mocha palette — see ../themes/mocha.tmux for the same
# semantic roles as tmux options. Names mirror Catppuccin's spec.
crust    = "#11111b"
mantle   = "#181825"
base     = "#1e1e2e"
surface0 = "#313244"
surface1 = "#45475a"
surface2 = "#585b70"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
overlay2 = "#9399b2"
subtext0 = "#a6adc8"
subtext1 = "#bac2de"
text     = "#cdd6f4"
yellow   = "#f9e2af"
peach    = "#fab387"
red      = "#f38ba8"
maroon   = "#eba0ac"
pink     = "#f5c2e7"
mauve    = "#cba6f7"
lavender = "#b4befe"
blue     = "#89b4fa"
sapphire = "#74c7ec"
sky      = "#89dceb"
teal     = "#94e2d5"
green    = "#a6e3a1"
flamingo = "#f2cdcd"
rosewater = "#f5e0dc"
frame    = "#6c7086"   # overlay0 — muted frame
# Personal accent — per-theme equivalent of Solarized's #DA627D pastel rose.
# Catppuccin canonical "personal" accent is pink.
pastel_rose = "#f5c2e7"
# Alias so the prompt format below stays portable across themes.
# base3 here is dark (#11111b crust) — chip-text inversion for
# pastel chip bgs (pastel_rose). Solarized uses light text on its saturated
# rose; Mocha needs dark text on its pastel rose.
base3       = "#11111b"

[directory]
format = "[ $path ]($style)"
style  = "fg:base3 bg:pastel_rose"
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[❯](bold fg:pastel_rose)"
error_symbol   = "[❯](bold fg:pastel_rose)"
vicmd_symbol   = "[❮](bold fg:pastel_rose)"

[cmd_duration]
min_time = 2000
format   = "[ $duration]($style) "
style    = "fg:pastel_rose"

[status]
disabled = false
format   = "[✘ $status]($style) "
style    = "fg:pastel_rose"

[jobs]
disabled = true
