"$schema" = "https://starship.rs/config-schema.json"

palette = "gruvbox"

format = """$directory[](fg:pastel_rose)
$character"""

right_format = "$status$cmd_duration"

[palettes.gruvbox]
# Gruvbox Dark Medium palette — see ../themes/gruvbox.tmux for the same
# semantic roles expressed as tmux user options. Names mirror Gruvbox's
# canonical role-color vocabulary.
bg           = "#282828"
bg_darker    = "#1d2021"
bg_lighter   = "#3c3836"
selection    = "#504945"
fg           = "#ebdbb2"
comment      = "#928374"
red          = "#cc241d"
orange       = "#d65d0e"
yellow       = "#d79921"
green        = "#98971a"
cyan         = "#689d6a"
purple       = "#b16286"
pink         = "#d3869b"
frame        = "#928374"   # gray — muted frame
# Personal accent — per-theme equivalent of Solarized's #DA627D pastel
# rose and Dracula's pink. Gruvbox canonical analogue is bright pink.
pastel_rose = "#d3869b"
# Alias so the prompt format below stays portable across themes.
# base3 here is dark (#282828 = bg0) — chip-text inversion for
# Gruvbox's saturated accents. Matches Mocha and Dracula; diverges
# from Solarized's light-on-saturated.
base3       = "#282828"

[directory]
format = "[ $path ]($style)"
style  = "fg:base3 bg:pastel_rose"
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[❯](bold fg:pastel_rose)"
error_symbol   = "[❯](bold fg:pastel_rose)"
vicmd_symbol   = "[❮](bold fg:pastel_rose)"

[cmd_duration]
min_time = 2000
format   = "[ $duration]($style) "
style    = "fg:pastel_rose"

[status]
disabled = false
format   = "[✘ $status]($style) "
style    = "fg:pastel_rose"

[jobs]
disabled = true
