"$schema" = "https://starship.rs/config-schema.json"

palette = "kanagawa"

format = """$directory[](fg:pastel_rose)
$character"""

right_format = "$status$cmd_duration"

[palettes.kanagawa]
# Kanagawa Wave palette — see ../themes/kanagawa.tmux for the same
# semantic roles expressed as tmux user options. Names mirror
# Kanagawa's canonical role-color vocabulary.
bg           = "#1f1f28"
bg_darker    = "#16161d"
bg_lighter   = "#2a2a37"
selection    = "#363646"
fg           = "#dcd7ba"
comment      = "#727169"
red          = "#c34043"
orange       = "#ffa066"
yellow       = "#c0a36e"
green        = "#76946a"
cyan         = "#6a9589"
purple       = "#957fb8"
pink         = "#d27e99"
frame        = "#727169"   # gray — muted frame
# Personal accent — per-theme equivalent of Solarized's #DA627D pastel
# rose and Dracula's pink. Kanagawa's canonical analogue is sakuraPink
# (#d27e99), the literal cherry-blossom pink in the palette.
pastel_rose = "#d27e99"
# Alias so the prompt format below stays portable across themes.
# base3 here is dark (#1f1f28 = sumiInk3) — chip-text inversion, since
# Kanagawa's accents are muted and dark text reads better on all of them.
base3       = "#1f1f28"

[directory]
format = "[ $path ]($style)"
style  = "fg:base3 bg:pastel_rose"
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[❯](bold fg:pastel_rose)"
error_symbol   = "[❯](bold fg:pastel_rose)"
vicmd_symbol   = "[❮](bold fg:pastel_rose)"

[cmd_duration]
min_time = 2000
format   = "[ $duration]($style) "
style    = "fg:pastel_rose"

[status]
disabled = false
format   = "[✘ $status]($style) "
style    = "fg:pastel_rose"

[jobs]
disabled = true
