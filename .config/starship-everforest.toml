"$schema" = "https://starship.rs/config-schema.json"

palette = "everforest"

format = """$directory[](fg:pastel_rose)
$character"""

right_format = "$status$cmd_duration"

[palettes.everforest]
# Everforest Dark Medium palette — see ../themes/everforest.tmux for the
# same semantic roles expressed as tmux user options. Names mirror
# Everforest's canonical role-color vocabulary.
bg           = "#2d353b"
bg_darker    = "#232a2e"
bg_lighter   = "#343f44"
selection    = "#3d484d"
fg           = "#d3c6aa"
comment      = "#7a8478"
red          = "#e67e80"
orange       = "#e69875"
yellow       = "#dbbc7f"
green        = "#a7c080"
cyan         = "#83c092"
purple       = "#d699b6"
pink         = "#d699b6"
frame        = "#7a8478"   # gray — muted frame
# Personal accent — per-theme equivalent of Solarized's #DA627D pastel
# rose and Dracula's pink. Everforest's canonical analogue is purple
# (#d699b6) — the palette's only pink-family hue.
pastel_rose = "#d699b6"
# Alias so the prompt format below stays portable across themes.
# base3 here is dark (#2d353b = bg0) — chip-text inversion, since
# Everforest's accents are light and low-saturation.
base3       = "#2d353b"

[directory]
format = "[ $path ]($style)"
style  = "fg:base3 bg:pastel_rose"
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[❯](bold fg:pastel_rose)"
error_symbol   = "[❯](bold fg:pastel_rose)"
vicmd_symbol   = "[❮](bold fg:pastel_rose)"

[cmd_duration]
min_time = 2000
format   = "[ $duration]($style) "
style    = "fg:pastel_rose"

[status]
disabled = false
format   = "[✘ $status]($style) "
style    = "fg:pastel_rose"

[jobs]
disabled = true
