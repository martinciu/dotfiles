# Tool set baked into the sandbox image (full interactive parity from the
# Brewfile MINUS tmux, PLUS wt). Fonts excluded (text boundary); the active Mac
# theme is baked + applied at container entry (#273).
# Installed by `install-linux.sh mise` at build time. "latest" is acceptable
# for v1; a committed lockfile for reproducibility is a follow-up.
[tools]
node = "lts"
go = "latest"
neovim = "latest"
bat = "latest"
eza = "latest"
fzf = "latest"
zoxide = "latest"
atuin = "latest"
delta = "latest"
difftastic = "latest"
ripgrep = "latest"
fd = "latest"
jq = "latest"
glow = "latest"
starship = "latest"
"github:dbrgn/tealdeer" = "latest"
vivid = "latest"
btop = "latest"
dust = "latest"
duf = "latest"
dua = "latest"
lnav = "latest"
"github:bensadeh/tailspin" = "latest"
xh = "latest"
ast-grep = "latest"
shellcheck = "latest"
shfmt = "latest"
lazygit = "latest"
hyperfine = "latest"
"github:max-sixty/worktrunk" = "latest"
