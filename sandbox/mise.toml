# Tool set baked into the sandbox image (full interactive parity from the
# Brewfile MINUS tmux, PLUS wt). Themes/fonts excluded (text boundary).
# Installed by `install-linux.sh mise` at build time. "latest" is acceptable
# for v1; a committed lockfile for reproducibility is a follow-up.
[tools]
node = "lts"
ruby = "latest"
neovim = "latest"
bat = "latest"
eza = "latest"
fzf = "latest"
zoxide = "latest"
atuin = "latest"
delta = "latest"
difftastic = "latest"
ripgrep = "latest"
fd = "latest"
jq = "latest"
glow = "latest"
tealdeer = "ubi:dbrgn/tealdeer"
vivid = "latest"
procs = "latest"
btop = "latest"
dust = "latest"
duf = "latest"
dua = "latest"
lnav = "latest"
tailspin = "ubi:bensadeh/tailspin"
xh = "latest"
ast-grep = "latest"
shellcheck = "latest"
shfmt = "latest"
lazygit = "latest"
hyperfine = "latest"
wt = "ubi:max-sixty/worktrunk"
