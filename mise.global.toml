[tools]
node = "lts"
ruby = "3.4.8"
# mise 2026.5.13 defaults npm installs to --ignore-scripts; mermaid-cli needs its
# puppeteer postinstall to fetch Chromium, so opt this one tool back in.
"npm:@mermaid-js/mermaid-cli" = { version = "latest", npm_args = "--ignore-scripts=false" }
"npm:ccstatusline" = "latest"
go = "1.25.10"
"npm:pnpm" = "latest"
# basalt (Obsidian vault TUI): the repo also tags basalt-core releases — tag_regex
# pins version resolution and asset-matching to the TUI crate. No brew formula;
# the github backend (ubi successor) pulls the prebuilt darwin-arm64 binary (no
# Rust toolchain) but extracts the tarball as-is, hence the arch-specific
# bin_path (fine — this repo is Apple Silicon only).
"github:erikjuhani/basalt" = { version = "latest", tag_regex = "^basalt/", exe = "basalt", bin_path = "aarch64-apple-darwin/release" }

[settings]
legacy_version_file = true
idiomatic_version_file_enable_tools = ["node", "ruby"]
# trusted_config_paths is machine-specific — it lives in the untracked
# ~/.config/mise/config.local.toml (seeded from mise.config.local.toml.template).
# Don't add it here: settings REPLACE across config files (no merge), so a
# value here would be silently overridden on any machine with a local file.

[settings.ruby]
compile = false
